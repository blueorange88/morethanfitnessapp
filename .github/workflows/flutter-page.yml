name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      # ── base-href 자동 계산 (username.github.io 저장소면 '/' , 그 외는 '/REPO/' )
      - name: Compute base-href
        id: base
        shell: bash
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *".github.io" ]]; then
            echo "href=/" >> $GITHUB_OUTPUT
          else
            echo "href=/${REPO}/" >> $GITHUB_OUTPUT
          fi

      # 👉 당신 저장소가 프로젝트 페이지(morethanfitnessapp)라면 자동 값은 '/morethanfitnessapp/'가 됩니다.
      #    특정 값으로 고정하고 싶다면 아래 run 한 줄에서 --base-href 뒤 값을 직접 적어도 됩니다.
      - name: Build web (release)
        run: |
          flutter build web \
            --release \
            --web-renderer canvaskit \
            --base-href "${{ steps.base.outputs.href }}"

      - name: SPA 404 fallback
        run: cp build/web/index.html build/web/404.html

      - name: List build output
        run: ls -al build/web

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          commit_message: "deploy: $(date +'%Y-%m-%d %H:%M:%S')"
