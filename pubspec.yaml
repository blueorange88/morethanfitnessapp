name: mtf_app
description: A new Flutter project.
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  signature: ^5.5.0

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  cloud_functions: ^5.0.0
  qr_flutter: ^4.1.0

  # 상태관리
  flutter_riverpod: ^2.5.1

  # 이미지 / OCR
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.1

  # 유틸리티
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  uuid: ^4.4.0
  animations: ^2.0.11
  home_widget: ^0.9.0

  # 아이콘
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/svg/morethan_holder_tintable.svg